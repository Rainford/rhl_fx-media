# Netlify publishes the RHL Journal app from the journal folder. No build step.
[build]
  base = "journal"
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# TradingView webhook -> journal
[[redirects]]
  from = "/api/tv"
  to = "/.netlify/functions/tv"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
