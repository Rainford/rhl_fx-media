<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RHL Journal</title>
<meta name="theme-color" content="#10131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with tabs; each tab is one scrolling column of panels (dashboard uses a 2-col grid on wide screens). Dark-only by design, matching RHL Trade Grader. */
:root{
  --bg:#10131a; --panel:#181d27; --inset:#131720; --line:#272e3b; --line2:#333b4a;
  --text:#e6e8ec; --mute:#8b93a3; --faint:#5d6576; --accent:#5b9dff;
  --good:#2fcf8a; --bad:#ff5d6c; --warn:#f0b445; --gold:#ffc42e;
  --good-bg:rgba(47,207,138,.12); --bad-bg:rgba(255,93,108,.12); --warn-bg:rgba(240,180,69,.12); --acc-bg:rgba(91,157,255,.14);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
body{margin:0;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g{color:var(--good)} .b{color:var(--bad)} .w{color:var(--warn)} .m{color:var(--mute)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--mono);font-weight:600;letter-spacing:.02em;font-size:15px}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--mute);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:var(--mute);text-decoration:none;padding:7px 12px;border-radius:7px;font-weight:500}
.tabs a[aria-current=page]{background:var(--panel);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#07111f;border:0;border-radius:8px;font-weight:600;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line2);font-weight:500}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:rgba(255,93,108,.45)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:0;color:var(--mute);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--line2);color:var(--text);font-weight:600}
.seg.wide{display:flex}.seg.wide button{flex:1}
.seg button.ok[aria-pressed=true]{background:var(--good-bg);color:var(--good)}
.seg button.no[aria-pressed=true]{background:var(--bad-bg);color:var(--bad)}

/* banners */
.banner{margin-top:14px;border:1px solid var(--line2);background:var(--acc-bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}
.banner.warn{background:var(--warn-bg);border-color:rgba(240,180,69,.4)}

main{padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.09em}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=datetime-local],input[type=date],textarea{background:var(--inset);border:1px solid var(--line2);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:14px;padding:7px 9px;max-width:100%}
textarea{font-family:var(--sans);width:100%;resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);min-width:0}
label.f input,label.f select{width:100%}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12px;color:var(--mute)}
.kpi b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi small{font-size:11px;color:var(--faint)}
.bar2{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--inset)}
.bar2 i{display:block;height:100%}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-dash{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2,.grid-dash{grid-template-columns:minmax(0,1fr)}}
svg text{font-family:var(--mono);font-size:10px;fill:var(--mute)}
.chart{width:100%;height:auto;display:block}

/* score */
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.scale{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));flex:none}
.scale i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-2px)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--inset)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:rgba(255,255,255,.025)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid var(--line2);color:var(--mute);font-family:var(--sans)}
.pill.win{color:var(--good);border-color:rgba(47,207,138,.45);background:var(--good-bg)}
.pill.loss{color:var(--bad);border-color:rgba(255,93,108,.45);background:var(--bad-bg)}
.pill.be{color:var(--warn);border-color:rgba(240,180,69,.45);background:var(--warn-bg)}
.pill.open{color:var(--accent);border-color:rgba(91,157,255,.45)}
.gr{font-family:var(--mono);font-weight:600}
.gr.A{color:var(--good)} .gr.B,.gr.C{color:var(--warn)} .gr.N{color:var(--bad)} .gr.U{color:var(--faint);font-weight:400}
.side{font-weight:600}.side.Long{color:var(--good)}.side.Short{color:var(--bad)}

/* breakdown list */
.blist{display:flex;flex-direction:column;gap:8px}
.bl{display:grid;grid-template-columns:90px minmax(0,1fr) 70px 64px;gap:10px;align-items:center;font-size:13px}
.bl .track{height:8px;background:var(--inset);border-radius:4px;position:relative;overflow:hidden}
.bl .track i{position:absolute;top:0;bottom:0;border-radius:4px}
.bl .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:11px;color:var(--mute);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--inset);cursor:pointer;text-align:left;min-width:0}
.cal .d.out{opacity:.35;cursor:default}
.cal .d .n{font-size:11px;color:var(--mute)}
.cal .d b{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:auto}
.cal .d small{font-size:10px;color:var(--mute)}
.cal .d.win{background:var(--good-bg);border-color:rgba(47,207,138,.35)}
.cal .d.loss{background:var(--bad-bg);border-color:rgba(255,93,108,.35)}
.cal .d.note{box-shadow:inset 0 2px 0 var(--accent)}
.cal .wk{font-size:11px}
@media (max-width:560px){.cal{gap:3px}.cal .d{min-height:54px;padding:4px}.cal .d b{font-size:11px}.cal .d small{display:none}}

/* playbook */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--inset);display:flex;flex-direction:column;gap:6px}
.rule h3{font-size:13px;letter-spacing:.06em}
.rule ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:16px;margin-right:auto}
.drawer .db{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.sec h3{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em}
.chk{display:flex;flex-direction:column;gap:6px}
.chk h4{margin:4px 0 0;font-size:10px;color:var(--faint);letter-spacing:.12em}
.ci{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button.ci{cursor:pointer}
.ci .box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:12px;line-height:1}
.ci.on .box{background:var(--good);border-color:var(--good);color:#0c1a14}
.ci.auto .box{border-style:dashed}
.ci.auto.off .box{border-color:var(--bad);color:var(--bad)}
.ci .lab{flex:1;min-width:0}
.ci .tag{font-size:9px;color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;letter-spacing:.06em}
.ci .pts{font-family:var(--mono);font-size:12px;color:var(--mute)}
.ci.on .pts{color:var(--good)}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.srow span{font-family:var(--mono);color:var(--mute);font-size:12px}
.gradebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--inset)}
.gradebar b{font-family:var(--mono);font-size:22px}
.verdict{border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;border:1px solid}
.verdict.ok{color:var(--good);border-color:rgba(47,207,138,.4);background:var(--good-bg)}
.verdict.bad{color:var(--bad);border-color:rgba(255,93,108,.45);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--inset);border:1px solid var(--line2);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer}
.chips button[aria-pressed=true]{color:var(--text);border-color:var(--accent);background:var(--acc-bg)}
.chips.bad button[aria-pressed=true]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
img.shot{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.msg{font-size:12px;color:var(--mute);min-height:16px}
input.masked{-webkit-text-security:disc;color:var(--mute)}
.empty{color:var(--mute);padding:20px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.jl{display:flex;flex-direction:column;gap:10px}
.je{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.je .top2{display:flex;justify-content:space-between;gap:10px}
.je p{margin:0;color:var(--mute);white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
@media (max-width:700px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;gap:0}
  .tabs a{flex:1;text-align:center;padding:8px 2px;font-size:12px}
  .tabs a[aria-current=page]{background:none;box-shadow:inset 0 2px 0 var(--accent);border-radius:0;color:var(--text)}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .top .row1{padding-block:10px}
  #importBtn{display:none}
}
@media (max-width:480px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:19px}.bl{grid-template-columns:70px minmax(0,1fr) 60px 52px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .18s ease-out}@keyframes slin{from{transform:translateX(24px);opacity:.6}}}
</style>

</head><body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand"><b>RHL<i>_</i>JOURNAL</b><span id="syncNote">Loading…</span></div>
      <div class="seg" id="unitSeg" aria-label="Show results in"><button type="button" data-u="R" aria-pressed="true">R</button><button type="button" data-u="$" aria-pressed="false">$</button></div>
      <button class="btn ghost" type="button" id="importBtn">Import MT5</button>
      <button class="btn" type="button" id="addBtn">+ Trade</button>
      <input type="file" id="importFile" accept=".html,.htm,.csv,.txt" hidden>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#dashboard">Dashboard</a><a href="#trades">Trades</a><a href="#calendar">Calendar</a><a href="#playbook">Playbook</a><a href="#journal">Journal</a><a href="#settings">Settings</a>
    </nav>
  </div>
</header>
<div class="wrap" id="bannerBox"></div>
<main class="wrap" id="view"></main>
<div id="drawerBox"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k){try{var v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return (n<10?'0':'')+n}
function dayKey(d){d=new Date(d);return isNaN(d)?'':d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toLocalInput(iso){var d=new Date(iso);if(isNaN(d))return'';d=new Date(d.getTime()-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function fromLocalInput(v){var d=new Date(v);return isNaN(d)?'':d.toISOString()}
function fmtDate(iso,withTime){var d=new Date(iso);if(isNaN(d))return'-';var o={month:'short',day:'numeric'};if(withTime){o.hour='2-digit';o.minute='2-digit'}return d.toLocaleString([],o)}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------------- state ---------------- */
var S={trades:[],days:{},live:false,demo:true,loaded:false,unit:lsGet('rhlj_unit')||'R',range:lsGet('rhlj_range')||'all',sym:'all',
  tf:{sym:'all',res:'all',plan:'all',q:''},month:null,db:null,assets:null,canWrite:true,err:''};
var MARKETS=['US30','JP225','USOIL','USTEC','XAUUSD'];
var MISTAKES=['Outside the plan','Entered early','Moved stop','Closed early','Chased entry','Revenge trade','Oversized','No session'];
var TAGS=['A+ setup','News','Asia','London','New York','Sweep','Clean break'];

/* ---------------- grading (same weights as RHL Trade Grader) ---------------- */
function sessionOf(when){
  var d=new Date(when); if(isNaN(d))return{name:'No time set',ok:false};
  var h=d.getUTCHours()+d.getUTCMinutes()/60;
  var a=h>=0&&h<9, l=h>=7&&h<16, n=h>=12&&h<21;
  return{name:n&&l?'London / New York':n?'New York':l&&a?'Asia / London':l?'London':a?'Asia':'Outside sessions',ok:a||l||n,key:n?'New York':l?'London':a?'Asia':'Outside'};
}
function blankChecks(){return{signal:false,brk1h:false,retest:false,prot:false,cont:false,htf:false}}
function grade(t){
  var long=t.dir==='Long', want=long?'Bullish':'Bearish', is15=t.model!=='1H';
  var e=+t.entry, s=+t.sl, tp=+t.tp, has=e>0&&s>0&&tp>0;
  var sides=has&&(long?(s<e&&tp>e):(s>e&&tp<e));
  var risk=Math.abs(e-s), rr=has&&sides&&risk>0?Math.abs(tp-e)/risk:0;
  var sess=sessionOf(t.open), c=t.checks||blankChecks();
  var ok4=t.s4h===want, ok1=t.s1h===want, ok15=t.s15===want, okRR=rr>=3, w=is15?10:15, rows=[];
  function H(x){rows.push({head:x})} function R(l,ok,p,k){rows.push({label:l,ok:!!ok,pts:p,key:k||null})}
  H('BIAS ALIGNMENT'); R('4H '+(t.s4h||'not set'),ok4,w); R('1H '+(t.s1h||'not set'),ok1,w); if(is15)R('15M '+(t.s15||'not set'),ok15,10);
  H('INDICATION'); R('RHL_FX '+(long?'BUY':'SELL')+' on '+(t.model||'15M'),c.signal,10,'signal'); R('1H break with bias',c.brk1h,10,'brk1h');
  H('CORRECTION'); R('Retest of broken liquidity',c.retest,15,'retest'); R('Protected '+(long?'low':'high')+' held',c.prot,10,'prot');
  H('CONTINUATION'); R((t.model||'15M')+' break with bias',c.cont,10,'cont');
  H('RISK AND TIMING'); R('R:R at least 1:3',okRR,10); R('Session: '+sess.name,sess.ok,5);
  H('BONUS'); R('R:R 1:4 or better',rr>=4,5); R('R:R 1:6 or better',rr>=6,5); R('Single HTF target',c.htf,5,'htf');
  var score=0; rows.forEach(function(r){if(!r.head&&r.ok)score+=r.pts});
  var brk='';
  if(!ok4)brk='Against 4H bias';
  else if(!okRR)brk=has&&!sides?'Stop or target on the wrong side of entry':has?'Planned R:R below 1:3':'Entry, stop and target needed';
  else if(!sess.ok)brk='Outside Asia, London and New York';
  var g=brk?'NO TRADE':score>=100?'A+':score>=90?'A':score>=80?'B':score>=70?'C':'NO TRADE';
  return{rows:rows,score:score,grade:g,rr:rr,brk:brk,sess:sess};
}
function gClass(g){return !g?'U':g==='NO TRADE'?'N':g.charAt(0)==='A'?'A':g==='B'?'B':'C'}

/* ---------------- derived trade numbers ---------------- */
function derive(t){
  var d={};
  var e=+t.entry, s=+t.sl, x=+t.exit, long=t.dir==='Long';
  d.closed=x>0||t.pnl!==''&&t.pnl!=null&&!isNaN(+t.pnl);
  d.r=null;
  if(e>0&&s>0&&x>0&&Math.abs(e-s)>0) d.r=(long?(x-e):(e-x))/Math.abs(e-s);
  d.pnl=(t.pnl===''||t.pnl==null||isNaN(+t.pnl))?null:+t.pnl;
  var basis=d.r!=null?d.r:(d.pnl!=null?d.pnl:null);
  d.res=!d.closed?'open':basis==null?'open':(d.r!=null?(d.r>0.1?'win':d.r<-0.1?'loss':'be'):(d.pnl>0?'win':d.pnl<0?'loss':'be'));
  d.g=t.graded?grade(t):null;
  d.plan=t.plan||(d.g?(d.g.grade==='NO TRADE'?'No':'Yes'):'');
  d.sess=sessionOf(t.open).key;
  d.day=dayKey(t.close||t.open);
  return d;
}
function all(){return S.trades.map(function(t){if(!t._d||t._v!==t._stamp){t._d=derive(t);t._v=t._stamp}return t})}
function val(t){return S.unit==='R'?t._d.r:t._d.pnl}
function fmtV(v,unit,sign){
  unit=unit||S.unit; if(v==null||isNaN(v))return'-';
  var sg=sign===false?'':(v>0?'+':v<0?'−':'');var a=Math.abs(v);
  return unit==='R'?sg+a.toFixed(2)+'R':sg+'$'+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtAx(v){var a=Math.abs(v),s=v<0?'−':'';return S.unit==='R'?s+(a%1?a.toFixed(1):a.toFixed(0))+'R':s+'$'+a.toLocaleString(undefined,{maximumFractionDigits:0})}
function vClass(v){return v==null?'m':v>0?'g':v<0?'b':'w'}

function inRange(t){
  var r=S.range; if(r==='all')return true;
  var d=new Date(t.close||t.open), now=new Date();
  if(r==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(r==='30')return now-d<=30*864e5;
  if(r==='week'){var w=new Date(now);w.setHours(0,0,0,0);w.setDate(w.getDate()-((w.getDay()+6)%7));return d>=w}
  return true;
}

/* ---------------- stats ---------------- */
function stats(list){
  var closed=list.filter(function(t){return t._d.res!=='open'});
  var wins=closed.filter(function(t){return t._d.res==='win'}), losses=closed.filter(function(t){return t._d.res==='loss'});
  var useV=function(t){var v=val(t);return v==null?0:v};
  var withV=closed.filter(function(t){return val(t)!=null});
  var net=withV.reduce(function(a,t){return a+val(t)},0);
  var gw=withV.filter(function(t){return val(t)>0}).reduce(function(a,t){return a+val(t)},0);
  var gl=Math.abs(withV.filter(function(t){return val(t)<0}).reduce(function(a,t){return a+val(t)},0));
  var nw=withV.filter(function(t){return val(t)>0}).length, nl=withV.filter(function(t){return val(t)<0}).length;
  var avgW=nw?gw/nw:0, avgL=nl?gl/nl:0;
  var graded=list.filter(function(t){return t._d.g});
  var planned=list.filter(function(t){return t._d.plan});
  var inPlan=planned.filter(function(t){return t._d.plan==='Yes'}).length;
  // daily
  var days={}; withV.forEach(function(t){days[t._d.day]=(days[t._d.day]||0)+val(t)});
  var dk=Object.keys(days).sort(), gd=dk.filter(function(k){return days[k]>0}).length;
  // drawdown on cumulative
  var seq=withV.slice().sort(function(a,b){return new Date(a.close||a.open)-new Date(b.close||b.open)});
  var cum=0,peak=0,dd=0; seq.forEach(function(t){cum+=val(t);peak=Math.max(peak,cum);dd=Math.max(dd,peak-cum)});
  return{n:list.length,closed:closed.length,wins:wins.length,losses:losses.length,be:closed.length-wins.length-losses.length,
    wr:(wins.length+losses.length)?wins.length/(wins.length+losses.length):null,net:net,gw:gw,gl:gl,pf:gl>0?gw/gl:(gw>0?Infinity:null),
    avgW:avgW,avgL:avgL,wl:avgL>0?avgW/avgL:(avgW>0?Infinity:null),days:days,dayKeys:dk,dayWr:dk.length?gd/dk.length:null,
    avgScore:graded.length?graded.reduce(function(a,t){return a+t._d.g.score},0)/graded.length:null,graded:graded.length,
    adherence:planned.length?inPlan/planned.length:null,planned:planned.length,dd:dd,seq:seq,
    best:withV.length?Math.max.apply(null,withV.map(val)):null,worst:withV.length?Math.min.apply(null,withV.map(val)):null};
}
function rhlScore(st){
  function c(x){return Math.max(0,Math.min(100,x))}
  var ddRef=S.unit==='R'?10:(st.gl>0&&st.avgL>0?st.avgL*10:1);
  var ax=[
    {k:'Win rate',v:st.wr==null?0:c(st.wr/0.6*100)},
    {k:'Profit factor',v:st.pf==null?0:c((isFinite(st.pf)?st.pf:3)/2.5*100)},
    {k:'Win/loss size',v:st.wl==null?0:c((isFinite(st.wl)?st.wl:4)/3*100)},
    {k:'Plan',v:st.adherence==null?0:c(st.adherence*100)},
    {k:'Grade',v:st.avgScore==null?0:c(st.avgScore)},
    {k:'Drawdown',v:st.closed?c(100-st.dd/ddRef*100):0}
  ];
  var tot=ax.reduce(function(a,x){return a+x.v},0)/ax.length;
  return{axes:ax,total:Math.round(tot)};
}

/* ---------------- charts (SVG) ---------------- */
function radar(ax){
  var W=380,H=260,cx=190,cy=132,R=92,n=ax.length,pts=[],grid='';
  for(var ring=1;ring<=4;ring++){var p=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+Math.cos(a)*R*ring/4).toFixed(1)+','+(cy+Math.sin(a)*R*ring/4).toFixed(1))}grid+='<polygon points="'+p.join(' ')+'" fill="none" stroke="var(--line2)" stroke-width="1"/>'}
  var spokes='',labels='';
  ax.forEach(function(x,i){var a=-Math.PI/2+i*2*Math.PI/n,ex=cx+Math.cos(a)*R,ey=cy+Math.sin(a)*R;
    spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="var(--line)"/>';
    var lx=cx+Math.cos(a)*(R+16),ly=cy+Math.sin(a)*(R+16),anc=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end';
    labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anc+'">'+esc(x.k)+'</text>';
    pts.push((cx+Math.cos(a)*R*x.v/100).toFixed(1)+','+(cy+Math.sin(a)*R*x.v/100).toFixed(1))});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="RHL score breakdown">'+grid+spokes+
    '<polygon points="'+pts.join(' ')+'" fill="rgba(91,157,255,.22)" stroke="var(--accent)" stroke-width="2"/>'+
    pts.map(function(p){var q=p.split(',');return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="var(--accent)"/>'}).join('')+labels+'</svg>';
}
function niceTicks(min,max,count){
  if(min===max){min-=1;max+=1}
  var span=max-min,step=Math.pow(10,Math.floor(Math.log10(span/count))),err=count/span*step;
  if(err<=.15)step*=10;else if(err<=.35)step*=5;else if(err<=.75)step*=2;
  var a=Math.floor(min/step)*step,b=Math.ceil(max/step)*step,t=[];for(var v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(10));return t;
}
function lineChart(seq){
  if(!seq.length)return '<div class="empty">No closed trades in this range yet.</div>';
  var W=640,H=240,L=54,Rr=12,T=12,B=26,cum=0,pts=[{x:0,y:0}];
  seq.forEach(function(t,i){cum+=val(t);pts.push({x:i+1,y:cum,t:t})});
  var ys=pts.map(function(p){return p.y}),ticks=niceTicks(Math.min.apply(null,ys),Math.max.apply(null,ys),4);
  var y0=ticks[0],y1=ticks[ticks.length-1],n=pts.length-1||1;
  var X=function(x){return L+(W-L-Rr)*x/n},Y=function(y){return T+(H-T-B)*(1-(y-y0)/(y1-y0))};
  var grid=ticks.map(function(v){return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===0?'var(--line2)':'var(--line)')+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+esc(fmtAx(v))+'</text>'}).join('');
  var d=pts.map(function(p,i){return(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  var zero=Y(Math.max(y0,Math.min(0,y1)));
  var area=d+' L'+X(n).toFixed(1)+' '+zero.toFixed(1)+' L'+X(0).toFixed(1)+' '+zero.toFixed(1)+' Z';
  var last=pts[pts.length-1],col=last.y>=0?'var(--good)':'var(--bad)';
  var xl='<text x="'+L+'" y="'+(H-8)+'">Trade 1</text><text x="'+(W-Rr)+'" y="'+(H-8)+'" text-anchor="end">Trade '+n+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative result">'+grid+
    '<path d="'+area+'" fill="'+(last.y>=0?'rgba(47,207,138,.12)':'rgba(255,93,108,.12)')+'"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+
    '<circle cx="'+X(n).toFixed(1)+'" cy="'+Y(last.y).toFixed(1)+'" r="4" fill="'+col+'"/>'+xl+'</svg>';
}
function barChart(days,keys){
  if(!keys.length)return '<div class="empty">No trading days in this range yet.</div>';
  keys=keys.slice(-30);
  var W=640,H=200,L=54,Rr=12,T=10,B=26,vs=keys.map(function(k){return days[k]});
  var ticks=niceTicks(Math.min(0,Math.min.apply(null,vs)),Math.max(0,Math.max.apply(null,vs)),4),y0=ticks[0],y1=ticks[ticks.length-1];
  var Y=function(y){return T+(H-T-B)*(1-(y-y0)/(y1-y0))},bw=(W-L-Rr)/keys.length;
  var grid=ticks.map(function(v){return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===0?'var(--line2)':'var(--line)')+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+esc(fmtAx(v))+'</text>'}).join('');
  var bars=keys.map(function(k,i){var v=days[k],y=Y(Math.max(v,0)),h=Math.abs(Y(v)-Y(0));return '<rect x="'+(L+i*bw+bw*.18).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="2" fill="'+(v>=0?'var(--good)':'var(--bad)')+'"><title>'+k+': '+fmtV(v)+'</title></rect>'}).join('');
  var lab='<text x="'+L+'" y="'+(H-8)+'">'+fmtDate(keys[0]+'T12:00')+'</text><text x="'+(W-Rr)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDate(keys[keys.length-1]+'T12:00')+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily result">'+grid+bars+lab+'</svg>';

function breakdown(list,keyFn,order){
  var g={};list.forEach(function(t){if(t._d.res==='open'||val(t)==null)return;var k=keyFn(t);if(!k)return;(g[k]=g[k]||[]).push(t)});

  if(cp){var el=$(cp.getAttribute('data-copy'));if(!el)return;
    var done=function(){var m=$('mtMsg');if(m)m.textContent='Copied.'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).then(done,function(){el.select()});else{el.select();try{document.execCommand('copy');done()}catch(e){}}
    return}
  if(id==='mtRetry'){MT.err='';MT.code=null;render();return}
  if(id==='mtShow'){MT.show=!MT.show;render();return}
  if(id==='mtNew'){if(MT.code&&!MT.armed){MT.armed=true;render();return}newSyncCode();return}
});
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function setMsg(t){Store.formMsg=t;if($('setMsg'))$('setMsg').textContent=t}
$('view').addEventListener('click',function(ev){
  var id=ev.target&&ev.target.id;
  if(ev.target.closest('[data-act=import]')){startImport();return}
  if(id==='cfgSave'){var cfg={url:$('cfgUrl').value.trim(),key:$('cfgKey').value.trim()};
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(cfg.url)){setMsg('The Project URL should look like https://abcd1234.supabase.co');return}
    if(cfg.key.length<40){setMsg('Paste the whole anon public key. It is a long line starting with eyJ.');return}
    cfg.url=cfg.url.replace(/\/$/,'');
    if(connect(cfg)){lsSet(K.cfg,cfg);setMsg('');render()}else setMsg(Store.msg);return}
  if(id==='cfgForget'){try{localStorage.removeItem(K.cfg)}catch(e){}Store.sb=null;Store.user=null;Store.status='local';setMsg('');render();return}
  if(id==='auIn'||id==='auUp'){var em=$('auEmail').value.trim(),pw=$('auPass').value;
    if(!em||pw.length<6){setMsg('Enter your email and a password of at least 6 characters.');return}
    ev.target.disabled=true;setMsg(id==='auIn'?'Signing in…':'Creating your account…');
    var p=id==='auIn'?Store.sb.auth.signInWithPassword({email:em,password:pw}):Store.sb.auth.signUp({email:em,password:pw});
    p.then(function(r){
      if(r.error){setMsg(r.error.message==='Invalid login credentials'?'Email or password is wrong. If this is your first time, tap Create account.':r.error.message);if(ev.target)ev.target.disabled=false;return}
      if(id==='auUp'&&!(r.data&&r.data.session)){setMsg('Account created. Open the confirmation email Supabase sent you, then come back and tap Sign in.');if(ev.target)ev.target.disabled=false;return}
      setMsg('');
    });return}
  if(id==='auOut'){Store.sb.auth.signOut().then(function(){setMsg('Signed out. Your trades stay on this device.')});return}
  if(id==='auSync'){setMsg('');pull();return}
  if(id==='bkOut'){var data=JSON.stringify({app:'RHL Journal',saved:new Date().toISOString(),trades:realTrades().map(stripD),days:S.days},null,1);
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='rhl-journal-backup-'+dayKey(new Date())+'.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);return}
  if(id==='bkInBtn'){$('bkIn').value='';$('bkIn').click();return}
});
$('view').addEventListener('change',function(ev){
  if(ev.target.id!=='bkIn')return;var f=ev.target.files&&ev.target.files[0];if(!f)return;
  f.text().then(function(txt){var o=JSON.parse(txt);if(!o||!Array.isArray(o.trades))throw 0;
    if(o.trades.length)putTrades(o.trades);
    Object.keys(o.days||{}).forEach(function(k){S.days[k]=o.days[k]});saveCache();queue(Object.keys(o.days||{}).map(function(k){return{k:'d',op:'put',id:k}}));
    setMsg('Restored '+o.trades.length+' trades and '+Object.keys(o.days||{}).length+' journal days.');render();
  }).catch(function(){setMsg('That file is not an RHL Journal backup.')});
});
window.addEventListener('online',function(){flush()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&Store.user)pull()});

S.trades=lsGet(K.t)||[];S.days=lsGet(K.d)||{};S.demo=false;showDemoIfEmpty();S.loaded=true;
connect(lsGet(K.cfg));
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
